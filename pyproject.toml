[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fewview"
description = "Full-sky visualisations of extreme mass-ratio inspirals with FastEMRIWaveforms"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "docs/img/DM-Sans-OFL.txt"]
authors = [{ name = "Ben Leather" }]
keywords = [
    "gravitational-waves",
    "EMRI",
    "visualization",
    "volume-rendering",
    "FastEMRIWaveforms",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
dynamic = ["version"]

dependencies = [
    "fastemriwaveforms>=2.2.0,<2.3",
    "fastemriwaveforms>=2.2.1.post1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "numpy",
    "scipy",
    "matplotlib>=3.6",
    "numba",
    "pyvista>=0.44",
    "imageio",
    "imageio-ffmpeg",
    "pillow",
]

[project.optional-dependencies]
test = ["pytest"]
docs = ["mkdocs>=1.6,<2"]

[project.urls]
Homepage = "https://github.com/bleather/FEWview"
Issues = "https://github.com/bleather/FEWview/issues"
Documentation = "https://fewview.readthedocs.io/en/latest/"

[project.scripts]
fewview-render = "fewview.cli.render_still:main"
fewview-animate = "fewview.cli.animate:main"
fewview-cluster-job = "fewview.cli.cluster_job:main"
fewview-cluster-segment = "fewview.cli.cluster_segment:main"
fewview-cluster-merge = "fewview.cli.cluster_merge:main"

[tool.hatch.version]
path = "src/fewview/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fewview"]

[tool.hatch.build.targets.wheel.force-include]
"docs/img" = "fewview/brand"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/mkdocs-overrides", "/mkdocs.yml", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
addopts = "-m 'not few_data'"
markers = ["few_data: numerical comparisons using FEW model data (up to 5 GB)"]
